services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  backend:
    build: ./src/backend
    volumes:
      - ./src/backend:/app
    env_file:
      - ./src/backend/.env
    depends_on:
      - db
    ports:
      - "5000:5000"
    command: flask run --host=0.0.0.0 --port=5000 --reload

  seed:
    build: ./src/backend
    volumes:
      - ./src/backend:/app
    env_file:
      - ./src/backend/.env
    depends_on:
      - db
    command: python -m db.utils.seed

  frontend:
    build: ./src/frontend
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    command: npm run dev

volumes:
  postgres_data: