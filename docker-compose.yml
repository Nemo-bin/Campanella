services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./src/backend
    volumes:
      - ./src/backend:/app
    env_file:
      - ./src/backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  seed:
    build: ./src/backend
    volumes:
      - ./src/backend:/app
    env_file:
      - ./src/backend/.env
    depends_on:
      - db
    command: python -m infrastructure.db.utils.seed

volumes:
  postgres_data: